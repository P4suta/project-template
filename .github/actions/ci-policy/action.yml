name: Build common development policy
description: Build the Rust policy command from this action's exact source revision.
outputs:
  executable:
    description: Absolute path to the compiled policy command.
    value: ${{ steps.build.outputs.executable }}
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      with:
        version: 2026.10.17
        install: false
    - name: Prepare the policy compiler
      shell: bash
      run: |
        mise install rust@1.99.1
        mise x rust@1.99.1 -- rustup component add rustfmt clippy --toolchain 1.99.1
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ github.action_path }}/../../../tools/ci-policy -> ${{ github.workspace }}/target
        cmd-format: mise x rust@1.99.1 -- {0}
        cache-bin: false
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - id: build
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        POLICY_SOURCE: ${{ github.action_path }}/../../..
        POLICY_OUTPUT: ${{ runner.temp }}/ci-policy
        CARGO_BUILD_JOBS: "2"
        CARGO_TARGET_DIR: ${{ github.workspace }}/target
      run: | # zizmor: ignore[github-env] -- Installs only this action's compiled policy into a fixed runner-owned directory.
        mise x rust@1.99.1 -- cargo install --locked --path "$POLICY_SOURCE/tools/ci-policy" --root "$POLICY_OUTPUT"
        "$POLICY_OUTPUT/bin/ci-policy" install-tools --workflow-only
        printf 'executable=%s/bin/ci-policy\n' "$POLICY_OUTPUT" >> "$GITHUB_OUTPUT"
        printf '%s/bin\n' "$POLICY_OUTPUT" >> "$GITHUB_PATH"
