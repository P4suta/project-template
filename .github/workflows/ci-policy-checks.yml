name: Production proof assurance
on:
  workflow_call:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MISE_AUTO_INSTALL: "false"
jobs:
  proofs:
    name: Production proofs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.0
          install: false
      - run: mise install rust@1.99.0 just@1.58.0 cargo:kani-verifier@0.68.0
      - name: Prepare the exact native verifier
        working-directory: ${{ runner.temp }}
        run: mise x rust@1.99.0 cargo:kani-verifier@0.68.0 -- kani setup
      - id: policy
        uses: $/.github/actions/ci-policy
      - run: mise x -- just check ci-policy-checks.yml::proofs
  verified:
    name: Production proofs verified
    if: always()
    needs: [proofs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: policy
        uses: $/.github/actions/ci-policy
      - name: Require every native proof
        env:
          POLICY: ${{ steps.policy.outputs.executable }}
          RESULTS: ${{ toJSON(needs) }}
        run: '"$POLICY" gate --needs "$RESULTS" --require-json ''["proofs"]'''
