name: Engine and policy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tmpl-verify-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MISE_AUTO_INSTALL: "false"
jobs:
  policy:
    uses: $/.github/workflows/common-policy.yml
  policy-code:
    uses: $/.github/workflows/ci-policy-checks.yml
  engine:
    name: Native implementation assurance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.0
          install: false
      - run: mise install rust@1.99.0 just@1.58.0 typos@1.50.3 cargo-binstall@1.25.1
      - name: Prepare pinned Cargo extensions
        env:
          MISE_CARGO_BINSTALL: "true"
          MISE_CARGO_BINSTALL_ONLY: "true"
        run: mise x rust@1.99.0 cargo-binstall@1.25.1 -- mise install cargo:cargo-nextest@0.9.146 cargo:cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .ci/ci-policy -> ../../target
            .template/tmpl -> ../../target
          cmd-format: mise x rust@1.99.0 -- {0}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: policy
        uses: $/.github/actions/ci-policy
      - run: mise x -- just check tmpl-verify.yml::engine
  coverage:
    name: Engine region coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.0
          install: false
      - run: mise install rust@1.99.0 just@1.58.0 cargo-binstall@1.25.1
      - run: mise x rust@1.99.0 -- rustup component add llvm-tools-preview --toolchain 1.99.0
      - name: Prepare the pinned coverage extension
        env:
          MISE_CARGO_BINSTALL: "true"
          MISE_CARGO_BINSTALL_ONLY: "true"
        run: mise x rust@1.99.0 cargo-binstall@1.25.1 -- mise install cargo:cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .ci/ci-policy -> ../../target
            .template/tmpl -> ../../target
          cmd-format: mise x rust@1.99.0 -- {0}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: policy
        uses: $/.github/actions/ci-policy
      - run: mise x -- just check tmpl-verify.yml::coverage
  required:
    name: required
    if: always()
    needs: [engine, coverage, policy, policy-code]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - id: policy
        uses: $/.github/actions/ci-policy
      - name: Require complete engine and policy assurance
        env:
          POLICY: ${{ steps.policy.outputs.executable }}
          RESULTS: ${{ toJSON(needs) }}
        run: '"$POLICY" gate --needs "$RESULTS" --require-json ''["engine", "coverage", "policy", "policy-code"]'''
