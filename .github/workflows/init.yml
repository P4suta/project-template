name: Template initialization
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: template-initialization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  init:
    name: Render initial project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.repository.name != 'project-template'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect an uninitialized project
        id: gate
        run: |
          if [ -f .template/tmpl/Cargo.toml ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.gate.outputs.render == 'true'
        with:
          toolchain: 1.99.1
      - name: Build the template engine
        if: steps.gate.outputs.render == 'true'
        run: cargo build --locked --release --manifest-path .template/tmpl/Cargo.toml
      - name: Render project files
        if: steps.gate.outputs.render == 'true'
        env:
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_OWNER: ${{ github.event.repository.owner.login }}
          PROJECT_DESCRIPTION: ${{ github.event.repository.description }}
          PROJECT_DESTINATION: ${{ runner.temp }}/initialized-project
        run: |
          .template/tmpl/target/release/tmpl \
            --template-root .template --dest "$PROJECT_DESTINATION" \
            apply --project-name "$PROJECT_NAME" --project-owner "$PROJECT_OWNER" \
            --project-description "${PROJECT_DESCRIPTION:-}"
      - name: Preserve rendered files for a normal reviewed commit
        id: policy
        if: steps.gate.outputs.render == 'true'
        uses: $/.github/actions/ci-policy
      - name: Produce the complete initialization patch
        if: steps.gate.outputs.render == 'true'
        env:
          POLICY: ${{ steps.policy.outputs.executable }}
          PROJECT_DESTINATION: ${{ runner.temp }}/initialized-project
          PROJECT_PATCH: ${{ runner.temp }}/initialized.patch
        run: '"$POLICY" template-patch --rendered "$PROJECT_DESTINATION" --engine .template/tmpl/target/release/tmpl --output "$PROJECT_PATCH"'
      - name: Preserve the reviewed initialization patch
        if: steps.gate.outputs.render == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: initialized-project
          path: ${{ runner.temp }}/initialized.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
