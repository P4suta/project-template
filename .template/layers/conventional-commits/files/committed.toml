# `committed` (https://github.com/crate-ci/committed) — Conventional Commits linter used by the commit-msg lefthook hook and by CI on PR titles.
#
# Keys are snake_case: `committed` silently ignores any key it does not know, kebab-case included.
# `committed --dump-config -` prints the configuration it actually applies.

style = "conventional"
subject_capitalized = false
subject_not_punctuated = true
imperative_subject = true
no_fixup = true
no_wip = true
allowed_types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "perf",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
]
